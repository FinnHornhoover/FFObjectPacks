name: Create Release with Artifacts

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native library headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config liblzma-dev zlib1g-dev
      - name: Compile
        run: cargo build --release --locked
      - name: Build and release packs
        run: |
          monitor_disk() {
            trap 'kill "${sleep_pid:-}" 2>/dev/null || true; exit 0' TERM
            while true; do
              echo "[$(date -u +%FT%TZ)] [disk] workspace filesystem"
              df -h .
              sleep 30 &
              sleep_pid=$!
              wait "$sleep_pid"
            done
          }
          monitor_disk &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          target/release/ffobjectpacks release
        env:
          GH_TOKEN: ${{ github.token }}
