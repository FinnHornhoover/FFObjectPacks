name: Create Release with Artifacts

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native library headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config liblzma-dev zlib1g-dev
      - name: Compile
        run: cargo build --release --locked
      - name: Build and release packs
        run: target/release/ffobjectpacks release
        env:
          GH_TOKEN: ${{ github.token }}
